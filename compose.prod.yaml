# Production override. Use together with compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build --wait      (or: make up-prod)
# Needs in .env: DOMAIN, POSTGRES_PASSWORD, FACE_SERVICE_TOKEN (a real secret). See .env.example.

x-logging: &logging
    driver: json-file
    options:
        max-size: "10m"
        max-file: "5"

services:
    postgres:
        restart: unless-stopped
        logging: *logging
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
        # ports: !reset []          # reachable only from inside the compose network
        volumes: # no test-database init script in production
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d app"]
            interval: 5s
            timeout: 3s
            retries: 10
        deploy:
            resources:
                limits:
                    memory: ${POSTGRES_MEMORY:-1g}

    face-service:
        restart: unless-stopped
        logging: *logging
        # CPU inference: the limits keep a burst of attempts from starving Postgres and the app.
        # FACE_CONCURRENCY should not exceed FACE_CPUS (see `make loadtest`).
        deploy:
            resources:
                limits:
                    cpus: ${FACE_CPUS:-8}
                    memory: ${FACE_MEMORY:-4g}

    app:
        restart: unless-stopped
        logging: *logging
        # ports: []          # only the reverse proxy is public
        environment:
            APP_ENV: prod
            COOKIE_SECURE: "true"
            DEV_STUDENT_PASSWORD_LOGIN: "false"
            FACE_SERVICE_TOKEN: ${FACE_SERVICE_TOKEN:?set FACE_SERVICE_TOKEN in .env}
            DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app?sslmode=disable
            # the proxy is the only peer that can reach the app; trust its X-Forwarded-For for client IPs
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
        deploy:
            resources:
                limits:
                    memory: ${APP_MEMORY:-512m}

    # HTTPS termination. Camera and geolocation only work over HTTPS. Certificates are obtained
    # automatically (Let's Encrypt) for DOMAIN; ports 80 and 443 must be reachable from the internet.
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        logging: *logging
        environment:
            DOMAIN: ${DOMAIN:?set DOMAIN in .env}
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        volumes:
            - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            app:
                condition: service_healthy

    # `make backup`: database dump + uploads archive into ./backups (see infra/backup/backup.sh).
    backup:
        profiles: [backup]
        image: postgres:16-alpine
        entrypoint: ["sh"]
        command: ["/scripts/backup.sh"]
        environment:
            PGHOST: postgres
            PGUSER: app
            PGDATABASE: app
            PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
        volumes:
            - ./infra/backup:/scripts:ro
            - uploads:/data/uploads:ro
            - ./backups:/backups
        depends_on:
            postgres:
                condition: service_healthy

    # `make restore`: see infra/backup/restore.sh. Writes to the uploads volume.
    restore:
        profiles: [restore]
        image: postgres:16-alpine
        entrypoint: ["sh"]
        command: ["/scripts/restore.sh"]
        environment:
            PGHOST: postgres
            PGUSER: app
            PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
            RESTORE_DB: ${RESTORE_DB:-}
            RESTORE_UPLOADS: ${RESTORE_UPLOADS:-}
            TARGET_DB: ${TARGET_DB:-app}
            CONFIRM: ${CONFIRM:-}
        volumes:
            - ./infra/backup:/scripts:ro
            - uploads:/data/uploads
            - ./backups:/backups:ro
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    caddy-data:
    caddy-config:
